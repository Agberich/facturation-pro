server:
  port: ${PORT:8080}

spring:
  application:
    name: facturation-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000        # Fix Neon connection pooling (10 mins)
      idle-timeout: 300000        # 5 mins
      validation-timeout: 3000    # 3 secs
      keepalive-time: 60000       # Keepalive ping every 60 secs

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-heures: 12