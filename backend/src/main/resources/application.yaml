server:
  port: 8080

spring:
  application:
    name: facturation-backend

  # Configuration de la base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/facturation_db?currentSchema=app_facturation,public
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:} # <-- surcharge via la variable d'environnement DB_PASSWORD en dehors de ta machine locale
    driver-class-name: org.postgresql.Driver

  # Configuration JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: none # Laisse Flyway gérer la création des tables
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuration de Flyway : scripts places dans src/main/resources/db/migration
  # (emplacement standard, embarque dans le JAR -> fonctionne sur n'importe quelle machine,
  # contrairement a l'ancien chemin absolu qui pointait sur le bureau Windows d'une autre personne)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Authentification (JWT)
